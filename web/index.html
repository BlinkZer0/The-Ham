  // against the templates).
  const CABINET_DEFAULTS = [
    { rotorConfig: 0, hornSlow: 0.8, hornFast: 6.7, hornAccel: 1.0, hornBrake: 1.5, drumSlow: 0.7, drumFast: 5.8, drumAccel: 4.0, drumBrake: 5.0, drumBaffle: 0, xover: 800, cabBack: 0, micLayout: 1 },
    { rotorConfig: 0, hornSlow: 0.85, hornFast: 6.8, hornAccel: 0.9, hornBrake: 1.4, drumSlow: 0.75, drumFast: 6.0, drumAccel: 3.5, drumBrake: 4.5, drumBaffle: 0, xover: 800, cabBack: 0, micLayout: 1 },
    { rotorConfig: 2, hornSlow: 0.9, hornFast: 6.0, hornAccel: 1.2, hornBrake: 2.0, drumSlow: 0.9, drumFast: 6.0, drumAccel: 1.2, drumBrake: 2.0, drumBaffle: 2, xover: 800, cabBack: 0, micLayout: 2 },
    { rotorConfig: 3, hornSlow: 0.8, hornFast: 6.7, hornAccel: 1.0, hornBrake: 1.5, drumSlow: 0.7, drumFast: 5.8, drumAccel: 4.0, drumBrake: 5.0, drumBaffle: 0, xover: 800, cabBack: 0, micLayout: 2 },

  // Master is never part of a preset. Stepped parameters snap like the plugin's int / choice params.

    const all = presetValues(pv);

    regs = pregs ? copyRegs(pregs) : hamFactoryRegistrations();

  current = { id: FACTORY[0].id, name: FACTORY[0].name, category: FACTORY[0].category };

  const audio = {
    ctx: null, node: null, port: null, mode: '', error: '',

  // The plugin editor polls the processor at 30 Hz; here the worklet reports at that rate.
  const lastKeys = new Uint32Array(6);
  const lastRotor = [-1, -1, -1, -1];
  let statsCount = 0;
  function onDspMessage(s) {
    if (s.type !== 'stats') return;

    toUi('stats', { peak: s.peak, sustain: s.sustain, modWheel: s.modWheel, expression: s.expression, motor: s.motor, perc: s.perc, speed: s.speed });
    if (s.hornTurns !== lastRotor[0] || s.drumTurns !== lastRotor[1] || s.hornHz !== lastRotor[2] || s.drumHz !== lastRotor[3]) {
      lastRotor[0] = s.hornTurns; lastRotor[1] = s.drumTurns; lastRotor[2] = s.hornHz; lastRotor[3] = s.drumHz;
      toUi('rotor', { hornAngle: s.hornTurns, drumAngle: s.drumTurns, hornHz: s.hornHz, drumHz: s.drumHz });

    toUi('params', { [id]: v });

  // The plugin keeps the map in the project state; here it is kept in this browser.
  const learn = { armed: '', map: {} };   // map: cc -> parameter id
  const learnableCC = (cc) => cc !== 0 && cc !== 32 && cc !== 64 && cc < 120;
  function learnedMap() {   // parameter id -> cc, as the `learn` event carries it
    const out = {};

  function handleMidi(d) {

          sendLearn();

      }

        return;
      }

      const ks = presetKeyswitch(d[1], ch, values.ksOn >= 0.5, values.splitMode >= 0.5, round(values.chUpper) - 1, round(values.chLower) - 1);
      if (ks.manual >= 0) {

      }

  }
  function sendMidi(data) {
    if (!audio.running && (data[0] & 0xf0) === 0x90 && data[2] > 0) message('Audio is off: click anywhere on the page once to enable it');
    audio.post({ type: 'midi', data });
  }

  // ----------------------------------------------------------------- MIDI ---
  const midi = { access: null, selected: store.get('ham.midiInput') || 'all' };
  function midiInputs() {
    return midi.access ? Array.from(midi.access.inputs.values()).map(i => ({ id: i.id, name: i.name, state: i.state })) : [];
  }
  function bindMidi() {
    if (!midi.access) return;
    for (const input of midi.access.inputs.values()) {
      const on = midi.selected === 'all' || midi.selected === input.id;
      input.onmidimessage = on ? (e) => onMidi(e.data) : null;
    }
  }
  function onMidi(d) {
    const st = d[0];
    if (st >= 0xf0 || st < 0x80) return;   // no SysEx / clock / running status
    const cmd = st & 0xf0;
    handleMidi(Array.from(d.slice(0, cmd === 0xc0 || cmd === 0xd0 ? 2 : 3)));
  }
  if (typeof navigator.requestMIDIAccess === 'function') {
    navigator.requestMIDIAccess({ sysex: false }).then((access) => {
      midi.access = access;
      access.onstatechange = () => { bindMidi(); toUi('midiInputs', { inputs: midiInputs(), selected: midi.selected }); };
      bindMidi();
      toUi('midiInputs', { inputs: midiInputs(), selected: midi.selected });
      const n = midiInputs().length;
      message(n ? `MIDI ready: ${n} input(s): ${midiInputs().map(i => i.name).join(', ')}` : 'MIDI ready: no devices found (plug one in, it appears automatically)');
    }).catch((e) => {
      toUi('midiInputs', { inputs: [], selected: 'all', error: true });
      message(`MIDI unavailable: ${e.message || e}`);
    });
  } else {
    queueMicrotask(() => toUi('midiInputs', { inputs: [], selected: 'all', error: true }));
  }

  // -------------------------------------------------------------- presets ---
  const LS_KEY = 'ham.userPresets.v1';
  const local = {
    read() { try { return JSON.parse(store.get(LS_KEY)) || {}; } catch (e) { return {}; } },
    write(obj) { return store.set(LS_KEY, JSON.stringify(obj)); },
  };
  const localPresets = () => Object.keys(local.read()).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
    .map(name => ({ id: `local:${name}`, name, category: 'User', factory: false }));

  const fsSupported = typeof window.showDirectoryPicker === 'function';
  const folder = { handle: null, granted: false, files: [], sig: '' };
  const idb = {
    open() {
      return new Promise((res, rej) => {
        const r = indexedDB.open('the-ham', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async get(key) {
      const db = await this.open();
      return new Promise((res) => { const r = db.transaction('kv').objectStore('kv').get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); });
    },
    async set(key, val) {
      const db = await this.open();
      return new Promise((res) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, key); tx.oncomplete = () => res(true); tx.onerror = () => res(false); });
    },
  };

  async function scanFolder() {
    if (!folder.handle || !folder.granted) return false;
    const files = [];
    async function walk(dir, path) {
      for await (const [name, h] of dir.entries()) {
        const rel = path ? `${path}/${name}` : name;
        if (h.kind === 'directory') await walk(h, rel);
        else if (name.toLowerCase().endsWith(HAM_PRESET_EXT)) {
          const f = await h.getFile();
          files.push({ id: `user:${rel}`, name: name.slice(0, -HAM_PRESET_EXT.length), category: path || 'User',
                       factory: false, handle: h, parent: dir, fileName: name, stamp: `${f.size}:${f.lastModified}` });
        }
      }
    }
    try { await walk(folder.handle, ''); } catch (e) { folder.granted = false; return true; }
    files.sort((a, b) => a.category.localeCompare(b.category, undefined, { numeric: true }) || a.name.localeCompare(b.name, undefined, { numeric: true }));
    const sig = files.map(f => `${f.id}|${f.stamp}`).join(';');
    if (sig === folder.sig) return false;
    folder.sig = sig;
    folder.files = files;
    return true;
  }

  function allPresets() { return [...FACTORY, ...folder.files, ...localPresets()]; }
  function sendPresetList() {
    toUi('presetList', {
      presets: allPresets().map(({ id, name, category, factory }) => ({ id, name, category, factory })),
      folder: folder.granted ? `${folder.handle.name} (linked folder)` : 'this browser: click FOLDER to link a folder on disk',
    });
  }

  async function linkFolder(handle, ask) {
    folder.handle = handle;
    folder.sig = '';
    let state = await handle.queryPermission({ mode: 'readwrite' });
    if (state !== 'granted' && ask) state = await handle.requestPermission({ mode: 'readwrite' });
    folder.granted = state === 'granted';
    await idb.set('presetFolder', handle);
    if (folder.granted) await scanFolder();
    sendPresetList();
    return folder.granted;
  }
  if (fsSupported && window.indexedDB) {
    idb.get('presetFolder').then(async (h) => {
      if (h && !(await linkFolder(h, false))) message(`Click FOLDER to reconnect the preset folder "${h.name}"`);
    }).catch(() => {});
  }
  setInterval(async () => { if (await scanFolder()) sendPresetList(); }, 2000); // autoload, like the plugin

  // Same rules as PresetManager::readJson: migrate, then at least one known parameter.
  function parsePresetText(text, fallbackName) {
    let json;
    try { json = JSON.parse(text); } catch (e) { throw new Error(`Not a valid preset file: ${fallbackName}`); }
    if (!json || typeof json !== 'object') throw new Error(`Not a The Ham preset: ${fallbackName}`);
    hamMigratePreset(json);
    const params = {};
    if (hamApplyParamObject(json.params, params) === 0) throw new Error(`No The Ham settings found in ${fallbackName}`);
    return { name: String(json.name || '').trim() || fallbackName, category: String(json.category || ''), params,
             registrations: hamReadRegistrations(json.registrations) };
  }
  // The file the plugin writes (PresetManager::toJson): 6 significant digits, drawbars as whole steps.
  function presetText(name, category) {
    const params = {};
    for (const d of PARAM_DEFS)
      if (!d.noPreset) params[d.id] = d.unit === 'bar' ? round(Number(values[d.id])) : +Number(values[d.id]).toPrecision(6);
    return JSON.stringify({ format: HAM_PRESET_FORMAT, version: HAM_PRESET_VERSION, name, category, params,
                            registrations: hamRegistrationsToJson(regs) }, null, 2);
  }
  const legalName = (s) => s.trim().replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);

  async function loadPresetById(id) {
    const p = allPresets().find(x => x.id === id);
    if (!p) { message('Preset not found (was it moved or deleted?)'); toUi('preset', current); return; }
    try {
      const info = { id, name: p.name, category: p.category };
      if (p.factory) applyPreset(p.values, p.registrations, info);
      else {
        const text = id.startsWith('local:') ? local.read()[p.name] : await (await p.handle.getFile()).text();
        const d = parsePresetText(text, p.name);
        applyPreset(d.params, d.registrations, info);
      }
    } catch (e) { message(e.message || String(e)); toUi('preset', current); }
  }

  function loadPresetText(text, fileName) {
    const p = parsePresetText(text, fileName.replace(/\.[^.]+$/, ''));
    applyPreset(p.params, p.registrations, { id: `file:${fileName}`, name: p.name, category: 'File' });
    message(`Loaded ${fileName}`);
  }

  async function savePreset(rawName, overwrite) {
    const name = legalName(rawName);
    const result = (r) => toUi('saveResult', Object.assign({ name, ok: false, exists: false, error: '' }, r));
    if (!name) return result({ error: 'Enter a name for the preset' });
    try {
      if (folder.granted) {
        const fileName = name + HAM_PRESET_EXT;
        if (!overwrite) {
          let exists = true;
          try { await folder.handle.getFileHandle(fileName); } catch (e) { exists = false; }
          if (exists) return result({ exists: true });
        }
        const w = await (await folder.handle.getFileHandle(fileName, { create: true })).createWritable();
        await w.write(presetText(name, 'User'));
        await w.close();
        await scanFolder();
        current = { id: `user:${fileName}`, name, category: 'User' };
      } else {
        const all = local.read();
        if (!overwrite && all[name]) return result({ exists: true });
        all[name] = presetText(name, 'User');
        if (!local.write(all)) throw new Error('browser storage is unavailable (private window?)');
        current = { id: `local:${name}`, name, category: 'User' };
      }
      sendPresetList();
      toUi('preset', current);
      result({ ok: true });
    } catch (e) { result({ error: e.message || String(e) }); }
  }

  async function deletePreset(id) {
    const p = allPresets().find(x => x.id === id);
    try {
      if (!p || p.factory) throw new Error('Only user presets can be deleted');
      if (id.startsWith('local:')) { const all = local.read(); delete all[p.name]; local.write(all); }
      else { await p.parent.removeEntry(p.fileName); await scanFolder(); }
      if (current.id === id) current = { id: '', name: current.name, category: 'User' };
      message(`Deleted preset "${p.name}"`);
    } catch (e) { message(e.message || String(e)); }
    sendPresetList();
    toUi('preset', current);
  }

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = `${HAM_PRESET_EXT},application/json`;
  fileInput.style.display = 'none';
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => document.body.appendChild(fileInput));
  else document.body.appendChild(fileInput);   // dev.html loads this after the document is ready
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!f) return;
    try { loadPresetText(await f.text(), f.name); }
    catch (e) { message(e.message || String(e)); }
  });

  async function folderButton() {
    if (!fsSupported) { message('Linking a preset folder needs Chrome or Edge: presets are saved in this browser instead.'); return; }
    try {
      if (folder.handle && !folder.granted) { if (await linkFolder(folder.handle, true)) message(`Reconnected "${folder.handle.name}"`); return; }
      const handle = await window.showDirectoryPicker({ id: 'ham-presets', mode: 'readwrite', startIn: 'documents' });
      await linkFolder(handle, true);
      message(`Preset folder linked: ${handle.name}, ${folder.files.length} preset(s). Link Documents\\The Ham\\Presets to share presets with the VST.`);
    } catch (e) { if (e && e.name !== 'AbortError') message(`Folder: ${e.message || e}`); }
  }

  // ------------------------------------------------- UI -> host events ---
  Object.assign(handlers, {
    uiReady() {
      sendConfig();
      sendPresetList();
      toUi('params', Object.assign({}, values));
      toUi('preset', current);
      toUi('registrations', hamRegistrationsToJson(regs));
      sendLearn();
      toUi('stats', { peak: 0, sustain: false, modWheel: 0, expression: 1, motor: 1, perc: 0, speed: round(values.speed) });
      if (midi.access) toUi('midiInputs', { inputs: midiInputs(), selected: midi.selected });
    },
    paramMenu() {}, // no host automation menu in a browser
    setParam({ id, value }) {
      const d = PARAM_BY_ID[id];
      if (!d) return;
      const v = snap(d, value);
      values[id] = v;
      audio.post({ type: 'param', id, value: v });
    },
    gesture() {},
    // the on-screen keyboards: manual 0 upper / 1 lower / 2 pedals, key index on that manual
    noteOn({ manual, key, vel }) {
      if (!audio.running) message('Audio is off: click anywhere on the page once to enable it');
      audio.post({ type: 'keyOn', manual: clamp(manual | 0, 0, 2), key: clamp(key | 0, 0, 60), vel: clamp(vel | 0, 1, 127) });
    },
    noteOff({ manual, key }) { audio.post({ type: 'keyOff', manual: clamp(manual | 0, 0, 2), key: clamp(key | 0, 0, 60) }); },
    panic() { audio.post({ type: 'panic' }); },
    expression({ value }) { audio.post({ type: 'expression', value: clamp(Number(value) || 0, 0, 1) }); },
    // fixed preset-key registrations: { manual: 0 / 1, key: 0..8 (C#..A), bars: "00 5320 000" }
    setRegistration({ manual, key, bars }) {
      const b = parseRegistration(bars);
      manual |= 0; key |= 0;
      if (!b || manual < 0 || manual > 1 || key < 0 || key > 8) return;
      regs[manual][key] = b;
      sendRegistrations();
    },
    midiLearn({ id }) { if (PARAM_BY_ID[id]) { learn.armed = id; sendLearn(); } },
    midiForget({ id }) { forgetLearn(id); },
    learnCancel() { learn.armed = ''; sendLearn(); },
    // a cabinet picked in the UI loads its defaults (speeds, ramps, rotors, baffle, crossover, mics)
    cabinetModel({ model }) {
      model = clamp(model | 0, 0, 3);
      const changed = Object.assign({ cabModel: model }, CABINET_DEFAULTS[model]);
      for (const id of Object.keys(changed)) { changed[id] = snap(PARAM_BY_ID[id], changed[id]); values[id] = changed[id]; }
      audio.post({ type: 'params', values: changed });
      toUi('params', changed);
    },
    selectMidi({ id }) { midi.selected = id; store.set('ham.midiInput', id); bindMidi(); },
    loadPreset({ id }) { loadPresetById(id); },
    savePreset({ name, overwrite }) { savePreset(String(name || ''), overwrite); },
    deletePreset({ id }) { deletePreset(id); },
    loadPresetFile() { fileInput.click(); },
    openPresetFolder() { folderButton(); },
  });

  // Test hook (tests/run-ui-tests.ps1): read-only view of the host state, a tap on what goes to the DSP,
  // a MIDI injection point and the preset text import.
  window.__hamWebHost = {
    values, factory: FACTORY, cabinetDefaults: CABINET_DEFAULTS,
    get regs() { return regs; }, get current() { return current; }, get audioMode() { return audio.mode; },
    get statsCount() { return statsCount; }, get learn() { return { armed: learn.armed, map: learnedMap() }; },
    sent: [], tap: false,
    midi(data) { handleMidi(Array.from(data)); },
    loadPresetText(text, fileName) { loadPresetText(text, fileName); },
    presetText(name) { return presetText(name, 'User'); },
    suspend() {
      audio.post({ type: 'panic' });
      if (audio.ctx && audio.ctx.state === 'running') audio.ctx.suspend().then(sendConfig).catch(() => {});
    },
    resume() {
      if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume().then(sendConfig).catch(() => {});
    },
  };
  const post = audio.post.bind(audio);
  audio.post = (m) => { if (window.__hamWebHost.tap) window.__hamWebHost.sent.push(m); post(m); };
})();

</script>
<script>
// ============================================================================
//  JUCE bridge: talks to the C++ processor through JUCE 8's native
//  integration (window.__JUCE__.backend). In the web build (phase 6),
//  vst/webhost/web-host.js provides the same backend on top of Web Audio.
// ============================================================================
'use strict';

class JuceEngine {
  constructor() {
    this.backend = (window.__JUCE__ && window.__JUCE__.backend) || null;
    this.connected = !!this.backend;
    this.handlers = {};
    if (this.backend) {
      for (const ev of ['params', 'notes', 'stats', 'config', 'presetList', 'preset', 'saveResult', 'message', 'midiInputs', 'rotor', 'registrations', 'learn']) {
        this.backend.addEventListener(ev, (data) => { if (this.handlers[ev]) this.handlers[ev](data); });
      }
    }
  }

  on(event, fn) { this.handlers[event] = fn; }
  emit(id, payload) { if (this.backend) this.backend.emitEvent(id, payload || {}); }

  uiReady() { this.emit('uiReady'); }

  // parameters
  setParam(id, value) { this.emit('setParam', { id, value }); }
  beginGesture(id) { this.emit('gesture', { id, begin: true }); }
  endGesture(id) { this.emit('gesture', { id, begin: false }); }

  // performance: manual 0 upper, 1 lower, 2 pedals; key = index on that manual (0 = its lowest C)
  noteOn(manual, key, vel) { this.emit('noteOn', { manual, key, vel }); }
  noteOff(manual, key) { this.emit('noteOff', { manual, key }); }
  panic() { this.emit('panic'); }
  expression(value) { this.emit('expression', { value }); }   // on-screen expression pedal 0..1

  // fixed registrations of the preset keys C#..A (key 0..8), e.g. bars = "00 5320 000"
  setRegistration(manual, key, bars) { this.emit('setRegistration', { manual, key, bars }); }

  // MIDI learn: arm a parameter (the next CC moved is assigned to it), forget it, or cancel
  midiLearn(id) { this.emit('midiLearn', { id }); }
  midiForget(id) { this.emit('midiForget', { id }); }
  learnCancel() { this.emit('learnCancel'); }

  // pick a cabinet model: the host sets it and loads its defaults (speeds, ramps, rotors, baffle, crossover, mics)
  cabinetModel(model) { this.emit('cabinetModel', { model }); }

  // right-click on a control -> the host's parameter menu (automation, MIDI learn...)
  paramMenu(id, x, y) { this.emit('paramMenu', { id, x: Math.round(x), y: Math.round(y) }); }

  // web build only (the plugin takes MIDI from the host)
  selectMidi(id) { this.emit('selectMidi', { id }); }

  // presets
  loadPreset(id) { this.emit('loadPreset', { id }); }
  savePreset(name, overwrite) { this.emit('savePreset', { name, overwrite: !!overwrite }); }
  deletePreset(id) { this.emit('deletePreset', { id }); }
  loadPresetFile() { this.emit('loadPresetFile'); }
  openPresetFolder() { this.emit('openPresetFolder'); }
}

</script>
  <script>
// ============================================================================
//  SVG rotary knob.
//  Drag up/down (Shift = fine), mouse wheel, arrow keys, double-click = default.
//  270° sweep. Bipolar params draw their arc from 12 o'clock.
// ============================================================================
'use strict';

const KNOB_SWEEP = 135; // degrees either side of 12 o'clock

function svgPolar(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

function svgArc(cx, cy, r, a0, a1) {
  if (Math.abs(a1 - a0) < 0.5) return '';
  const lo = Math.min(a0, a1), hi = Math.max(a0, a1);
  const [x0, y0] = svgPolar(cx, cy, r, lo);
  const [x1, y1] = svgPolar(cx, cy, r, hi);
  const large = hi - lo > 180 ? 1 : 0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

class Knob {
  // onGesture(true/false) brackets a drag so the DAW records it as one automation gesture.
  constructor(def, value, onChange, onGesture) {
    this.def = def;
    this.onChange = onChange;
    this.onGesture = onGesture || null;
    this.value = value;
    this.drag = null;

    const el = document.createElement('div');
    el.className = 'knob';
    let ticks = '';
    if (def.type === 'choice') {
      const steps = def.max - def.min;
      for (let i = 0; i <= steps; i++) {
        const [x, y] = svgPolar(32, 32, 31, -KNOB_SWEEP + (2 * KNOB_SWEEP * i) / steps);
        ticks += `<circle class="k-tick" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.4"/>`;
      }
    }
    el.innerHTML = `
      <svg class="knob-svg" viewBox="0 0 64 64" tabindex="0" role="slider"
           aria-label="${def.name}" aria-valuemin="${def.min}" aria-valuemax="${def.max}">
        <path class="k-track" d="${svgArc(32, 32, 26, -KNOB_SWEEP, KNOB_SWEEP)}"/>
        ${ticks}
        <path class="k-value" d=""/>
        <circle class="k-face" cx="32" cy="32" r="19"/>
        <g class="k-rot"><line class="k-pointer" x1="32" y1="24" x2="32" y2="15"/></g>
      </svg>
      <div class="knob-value"></div>
      <div class="knob-label">${def.name}</div>`;
    this.el = el;
    this.svg = el.querySelector('svg');
    this.valuePath = el.querySelector('.k-value');
    this.rot = el.querySelector('.k-rot');
    this.readout = el.querySelector('.knob-value');
    this.bindEvents();
    this.render();
  }

  get norm() { return paramToNorm(this.def, this.value); }

  setValue(v, notify = false) {
    v = clamp(v, this.def.min, this.def.max);
    if (v === this.value) return;
    this.value = v;
    this.render();
    if (notify && this.onChange) this.onChange(v);
  }

  setNorm(n) { this.setValue(paramFromNorm(this.def, n), true); }

  nudge(dir, fine) {
    const d = this.def;
    if (d.step) this.setValue(this.value + dir * d.step, true);
    else this.setNorm(this.norm + dir * (fine ? 0.002 : 0.01));
  }

  render() {
    const d = this.def;
    const angle = -KNOB_SWEEP + this.norm * 2 * KNOB_SWEEP;
    const startAngle = d.bipolar ? 0 : -KNOB_SWEEP;
    this.valuePath.setAttribute('d', svgArc(32, 32, 26, startAngle, angle));
    this.rot.setAttribute('transform', `rotate(${angle.toFixed(2)} 32 32)`);
    this.readout.textContent = formatParam(d, this.value);
    this.svg.setAttribute('aria-valuenow', String(this.value));
    this.svg.setAttribute('aria-valuetext', formatParam(d, this.value));
  }

  bindEvents() {
    const svg = this.svg;
    svg.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      svg.focus();
      this.drag = { y: e.clientY, norm: this.norm };
      this.el.classList.add('active');
      if (this.onGesture) this.onGesture(true);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!this.drag) return;
      const dy = this.drag.y - e.clientY;
      this.drag.y = e.clientY;
      this.drag.norm = clamp(this.drag.norm + dy * (e.shiftKey ? 0.001 : 0.005), 0, 1);
      this.setNorm(this.drag.norm);
    });
    const end = () => {
      if (!this.drag) return;
      this.drag = null;
      this.el.classList.remove('active');
      if (this.onGesture) this.onGesture(false);
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('dblclick', () => this.setValue(this.def.def, true));
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.nudge(e.deltaY < 0 ? 1 : -1, e.shiftKey);
    }, { passive: false });
    svg.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.nudge(dir, e.shiftKey); }
    });
  }
}

</script>
  <script>
// ============================================================================
//  Parameter controls besides the knob. Same conventions as Knob:
//  setValue(v) updates the display, onChange(v) fires on user edits.
//    ToggleButton - bool param   (click; double-click = default)
//    Segmented    - choice param (click; wheel / arrow keys step; double-click = default)
//    SelectBox    - choice param (native dropdown; wheel steps; double-click = default)
//    ModWheel     - SVG performance wheel (drag, wheel, arrow keys, double-click = 0)
// ============================================================================
'use strict';

class ToggleButton {
  constructor(def, value, onChange, label) {
    this.def = def;
    this.onChange = onChange;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'power';
    b.innerHTML = `<span class="led"></span><span>${label || 'ON'}</span>`;
    b.addEventListener('click', () => this.onChange(this.value >= 0.5 ? 0 : 1));
    this.el = b;
    this.setValue(value);
  }
  setValue(v) {
    this.value = v;
    this.el.classList.toggle('on', v >= 0.5);
    this.el.setAttribute('aria-pressed', v >= 0.5);
  }
}

class Segmented {
  constructor(def, value, onChange, labels) {
    this.def = def;
    this.onChange = onChange;
    const wrap = document.createElement('div');
    wrap.className = 'seg';
    wrap.setAttribute('role', 'radiogroup');
    wrap.setAttribute('aria-label', def.name);
    this.buttons = (labels || def.choices).map((label, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.setAttribute('role', 'radio');
      b.addEventListener('click', () => this.pick(i));
      wrap.appendChild(b);
      return b;
    });
    wrap.addEventListener('wheel', (e) => { e.preventDefault(); this.pick(this.value + (e.deltaY < 0 ? 1 : -1)); }, { passive: false });
    wrap.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.pick(this.value + dir); this.buttons[this.value].focus(); }
    });
    wrap.addEventListener('dblclick', () => this.pick(this.def.def));
    this.el = wrap;
    this.setValue(value);
  }
  pick(i) {
    i = clamp(Math.round(i), 0, this.buttons.length - 1);
    if (this.buttons[i].disabled) return;
    if (i !== this.value) this.onChange(i);
  }
  setValue(v) {
    this.value = clamp(Math.round(v), 0, this.buttons.length - 1);
    this.buttons.forEach((b, i) => { b.classList.toggle('on', i === this.value); b.setAttribute('aria-checked', i === this.value); });
  }
}

class SelectBox {
  constructor(def, value, onChange, labels) {
    this.def = def;
    this.onChange = onChange;
    const s = document.createElement('select');
    s.className = 'param-select';
    s.setAttribute('aria-label', def.name);
    (labels || def.choices).forEach((label, i) => s.appendChild(new Option(label, String(i))));
    s.addEventListener('change', () => this.onChange(Number(s.value)));
    s.addEventListener('wheel', (e) => {
      e.preventDefault();
      const i = clamp(this.value + (e.deltaY < 0 ? -1 : 1), 0, s.options.length - 1);
      if (i !== this.value) this.onChange(i);
    }, { passive: false });
    s.addEventListener('dblclick', () => { if (this.value !== this.def.def) this.onChange(this.def.def); });
    s.addEventListener('keydown', (e) => e.stopPropagation()); // arrow keys belong to the dropdown, not the piano
    this.el = s;
    this.setValue(value);
  }
  setValue(v) {
    this.value = clamp(Math.round(v), 0, this.el.options.length - 1);
    this.el.value = String(this.value);
  }
}

class ModWheel {
  // label / title: also used as the on-screen breath controller ("BREATH")
  constructor(onChange, onGesture, label, title) {
    this.onChange = onChange;
    this.onGesture = onGesture || null;
    this.value = 0;
    this.drag = null;
    const H = 110, W = 26, T = 16;
    this.H = H; this.T = T;
    const ridges = Array.from({ length: 14 }, (_, i) => `<line x1="4" x2="${W - 4}" y1="${6 + i * 7.5}" y2="${6 + i * 7.5}"/>`).join('');
    const el = document.createElement('div');
    el.className = 'wheel-ctl';
    el.innerHTML = `
      <svg class="wheel-svg" viewBox="0 0 ${W} ${H}" tabindex="0" role="slider" aria-label="${title || 'Mod wheel'}"
           aria-valuemin="0" aria-valuemax="127">
        <rect class="wh-slot" x="0.5" y="0.5" width="${W - 1}" height="${H - 1}" rx="5"/>
        <g class="wh-ridges">${ridges}</g>
        <rect class="wh-fill" x="3" width="${W - 6}" rx="3"/>
        <rect class="wh-thumb" x="2" width="${W - 4}" height="${T}" rx="3"/>
      </svg>
      <span class="ctl-label">${label || 'MOD'}</span>
      <span class="wheel-value">0</span>`;
    this.el = el;
    this.svg = el.querySelector('svg');
    this.thumb = el.querySelector('.wh-thumb');
    this.fill = el.querySelector('.wh-fill');
    this.readout = el.querySelector('.wheel-value');
    this.bind();
    this.render();
  }

  set(v, notify) {
    v = clamp(v, 0, 1);
    if (v === this.value) return;
    this.value = v;
    this.render();
    if (notify) this.onChange(v);
  }
  setValue(v) { if (!this.drag) this.set(v, false); }

  render() {
    const y = (this.H - this.T - 4) * (1 - this.value) + 2;
    this.thumb.setAttribute('y', y.toFixed(1));
    this.fill.setAttribute('y', (y + this.T / 2).toFixed(1));
    this.fill.setAttribute('height', Math.max(0, this.H - 3 - (y + this.T / 2)).toFixed(1));
    const midi = Math.round(this.value * 127);
    this.readout.textContent = midi;
    this.svg.setAttribute('aria-valuenow', String(midi));
  }

  bind() {
    const svg = this.svg;
    const fromY = (clientY) => {
      const r = svg.getBoundingClientRect();
      return 1 - (clientY - r.top - (this.T / 2) * (r.height / this.H)) / (r.height * (this.H - this.T) / this.H);
    };
    svg.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      svg.focus();
      this.drag = { y: e.clientY, v: this.value };
      if (this.onGesture) this.onGesture(true);
      if (!e.shiftKey) this.set(fromY(e.clientY), true); // click jumps, Shift-drag is relative + fine
    });
    svg.addEventListener('pointermove', (e) => {
      if (!this.drag) return;
      if (e.shiftKey) {
        this.drag.v = clamp(this.drag.v + (this.drag.y - e.clientY) * 0.002, 0, 1);
        this.drag.y = e.clientY;
        this.set(this.drag.v, true);
      } else {
        this.drag.y = e.clientY;
        this.drag.v = fromY(e.clientY);
        this.set(this.drag.v, true);
      }
    });
    const end = () => { if (!this.drag) return; this.drag = null; if (this.onGesture) this.onGesture(false); };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('dblclick', () => this.set(0, true));
    svg.addEventListener('wheel', (e) => { e.preventDefault(); this.set(this.value + (e.deltaY < 0 ? 1 : -1) * (e.shiftKey ? 1 / 127 : 8 / 127), true); }, { passive: false });
    svg.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.set(this.value + dir * (e.shiftKey ? 1 / 127 : 8 / 127), true); }
    });
  }
}

// ---------------------------------------------------------------------------
// Rocker: the organ's tablet switch, for a bool or a two-choice parameter. The tab
// tilts (CSS 3D, animated) toward the selected half; click toggles, or click a half.
// labels: [first, second] (bool: [off, on]); title: printed on the tab.
class Rocker {
  constructor(def, value, onChange, title, labels, tone) {
    this.def = def;
    this.onChange = onChange;
    this.labels = labels || (def.type === 'bool' ? ['OFF', 'ON'] : def.choices);
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'rocker' + (tone ? ' ' + tone : '');
    el.setAttribute('aria-label', def.name);
    el.innerHTML = `<span class="rocker-tab"><span class="rk-top">${this.labels[1]}</span>`
      + `<span class="rk-title">${title || def.name}</span><span class="rk-bot">${this.labels[0]}</span></span>`;
    el.addEventListener('click', (e) => {
      const r = el.getBoundingClientRect();
      const half = e.clientY < r.top + r.height * 0.38 ? 1 : (e.clientY > r.bottom - r.height * 0.38 ? 0 : (this.value >= 0.5 ? 0 : 1));
      if (half !== (this.value >= 0.5 ? 1 : 0)) this.onChange(half);
    });
    el.addEventListener('dblclick', (e) => e.preventDefault());
    this.el = el;
    this.setValue(value);
  }
  setValue(v) {
    this.value = v;
    const on = v >= 0.5;
    this.el.classList.toggle('on', on);
    this.el.setAttribute('aria-pressed', on);
    this.el.title = `${this.def.name}: ${formatParam(this.def, v)}`;
  }
}

// ---------------------------------------------------------------------------
// ExpressionPedal: a swell shoe seen from the side. Toe down = open (1). Drag up/down,
// wheel, double-click = open. Follows the engine's value (CC11) with a short animation.
class ExpressionPedal {
  constructor(onChange, onGesture) {
    this.onChange = onChange;
    this.onGesture = onGesture || null;
    this.value = 1;
    this.drag = null;
    const el = document.createElement('div');
    el.className = 'expr-pedal';
    el.innerHTML = `
      <svg viewBox="0 0 70 54" tabindex="0" role="slider" aria-label="Expression pedal" aria-valuemin="0" aria-valuemax="127">
        <rect class="ep-base" x="4" y="42" width="62" height="8" rx="3"/>
        <rect class="ep-hinge" x="8" y="34" width="8" height="10" rx="2"/>
        <g class="ep-shoe"><rect class="ep-plate" x="8" y="28" width="58" height="9" rx="3"/>
          <line class="ep-tread" x1="22" x2="62" y1="31" y2="31"/><line class="ep-tread" x1="22" x2="62" y1="34" y2="34"/></g>
      </svg>
      <span class="ctl-label">EXPR</span><span class="wheel-value">127</span>`;
    this.el = el;
    this.svg = el.querySelector('svg');
    this.shoe = el.querySelector('.ep-shoe');
    this.readout = el.querySelector('.wheel-value');
    this.bind();
    this.render();
  }
  set(v, notify) {
    v = clamp(v, 0, 1);
    if (v === this.value) return;
    this.value = v;
    this.render();
    if (notify) this.onChange(v);
  }
  setValue(v) { if (!this.drag) this.set(v, false); }
  render() {
    // closed: toe up (-17 deg); open: toe down (+4 deg), hinged at the heel
    this.shoe.style.transform = `rotate(${(-17 + 21 * this.value).toFixed(1)}deg)`;
    this.readout.textContent = Math.round(this.value * 127);
    this.svg.setAttribute('aria-valuenow', String(Math.round(this.value * 127)));
  }
  bind() {
    const svg = this.svg;
    svg.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      this.drag = { y: e.clientY, v: this.value };
      if (this.onGesture) this.onGesture(true);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!this.drag) return;
      this.set(this.drag.v + (e.clientY - this.drag.y) * 0.01, true);   // push the toe down = open
    });
    const end = () => { if (!this.drag) return; this.drag = null; if (this.onGesture) this.onGesture(false); };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('dblclick', () => this.set(1, true));
    svg.addEventListener('wheel', (e) => { e.preventDefault(); this.set(this.value + (e.deltaY > 0 ? 1 : -1) * (e.shiftKey ? 1 / 127 : 8 / 127), true); }, { passive: false });
  }
}

  <script>
// ============================================================================
//  Drawbar: a bar that pulls DOWN out of the panel, 9 detents (0..8).
//  The shaft is numbered 1..8; the number at the panel lip is the setting.
//  Tip colour by footage: brown (16', 5 1/3'), white (8', 4', 2', 1'),
//  black (2 2/3', 1 3/5', 1 1/3').
//  Same conventions as Knob: drag (snaps to detents; Shift = continuous, for
//  automation), mouse wheel / arrow keys (Shift = fine), double-click = default,
//  gesture begin/end around drags. setValue() from the host animates (~150 ms).
//
//  DrawbarSet: 9 drawbars + an editable registration string ("88 8000 000").
// ============================================================================
'use strict';

const DB_W = 30, DB_STEP = 21, DB_SLOT = 24, DB_TIP = 30;
const DB_H = DB_SLOT + 8 * DB_STEP + DB_TIP + 6;
const DB_ANIM_MS = 150;

class Drawbar {
  constructor(def, value, tip, label, onChange, onGesture) {
    this.def = def;
    this.onChange = onChange;
    this.onGesture = onGesture || null;
    this.value = value;     // logical value (what the host has)
    this.shown = value;     // drawn value (animates towards value)
    this.drag = null;
    this.anim = null;

    const nums = [];
    for (let k = 1; k <= 8; k++) {
      const y = -(k - 0.5) * DB_STEP;
      nums.push(`<line class="db-tick" x1="9" x2="21" y1="${(-(k) * DB_STEP).toFixed(1)}" y2="${(-(k) * DB_STEP).toFixed(1)}"/>`);
      nums.push(`<text class="db-num" x="${DB_W / 2}" y="${(y + 4).toFixed(1)}">${k}</text>`);
    }
    const uid = `db${Drawbar.next = (Drawbar.next || 0) + 1}`;
    const el = document.createElement('div');
    el.className = 'drawbar';
    el.innerHTML = `
      <svg class="db-svg" viewBox="0 0 ${DB_W} ${DB_H}" tabindex="0" role="slider"
           aria-label="${def.name}" aria-valuemin="0" aria-valuemax="8">
        <defs><clipPath id="${uid}-clip"><rect x="0" y="${DB_SLOT}" width="${DB_W}" height="${DB_H}"/></clipPath></defs>
        <g clip-path="url(#${uid}-clip)">
          <g class="db-shaft">
            <rect class="db-body" x="8" y="${-8 * DB_STEP - 4}" width="14" height="${8 * DB_STEP + 6}" rx="1"/>
            ${nums.join('')}
          </g>
        </g>
        <g class="db-tipg">
          <rect class="db-tip tip-${tip}" x="4" y="0" width="22" height="${DB_TIP}" rx="5"/>
          <rect class="db-tip-shine" x="6.5" y="3" width="17" height="7" rx="3"/>
          <rect class="db-tip-ring" x="4" y="0" width="22" height="4" rx="2"/>
        </g>
        <rect class="db-slot" x="5" y="${DB_SLOT - 6}" width="20" height="7" rx="2"/>
        <text class="db-foot" x="${DB_W / 2}" y="11">${label}</text>
      </svg>`;
    this.el = el;
    this.svg = el.querySelector('svg');
    this.shaft = el.querySelector('.db-shaft');
    this.tipg = el.querySelector('.db-tipg');
    this.bindEvents();
    this.draw();
  }

  // from the host / a preset: animate to the new position
  setValue(v) {
    v = clamp(v, 0, 8);
    if (v === this.value && !this.anim) return;
    this.value = v;
    this.label();
    if (this.drag) return;
    if (Math.abs(v - this.shown) < 0.01 || document.hidden) { this.stopAnim(); this.shown = v; this.draw(); return; }
    this.animateTo(v);
  }

  animateTo(v) {
    this.stopAnim();
    const from = this.shown, t0 = performance.now();
    const step = (t) => {
      const x = clamp((t - t0) / DB_ANIM_MS, 0, 1);
      const e = 1 - (1 - x) * (1 - x) * (1 - x);   // ease out
      this.shown = from + (v - from) * e;
      this.draw();
      this.anim = x < 1 ? requestAnimationFrame(step) : null;
    };
    this.anim = requestAnimationFrame(step);
  }
  stopAnim() { if (this.anim) cancelAnimationFrame(this.anim); this.anim = null; }

  // a change made here: draw at once, tell the host
  set(v, notify) {
    v = clamp(v, 0, 8);
    this.stopAnim();
    const changed = v !== this.value;
    this.value = v;
    this.shown = v;
    this.draw();
    if (changed && notify) this.onChange(v);
  }

  draw() {
    const len = this.shown * DB_STEP;
    this.shaft.setAttribute('transform', `translate(0 ${(DB_SLOT + len).toFixed(2)})`);
    this.tipg.setAttribute('transform', `translate(0 ${(DB_SLOT - 2 + len).toFixed(2)})`);
    this.label();
  }

  // accessible value + tooltip: the logical value, at once (the picture may still be animating)
  label() {
    const txt = formatParam(this.def, this.value);
    this.svg.setAttribute('aria-valuenow', String(this.value));
    this.svg.setAttribute('aria-valuetext', txt);
    this.el.title = `${this.def.name}: ${txt}`;
  }

  nudge(dir, fine) {
    const v = fine ? Math.round((this.value + dir * 0.1) * 10) / 10 : Math.round(this.value) + dir;
    this.set(v, true);
  }

  bindEvents() {
    const svg = this.svg;
    svg.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      svg.focus();
      const scale = svg.getBoundingClientRect().height / DB_H;
      this.drag = { y: e.clientY, start: this.value, scale };
      this.el.classList.add('active');
      if (this.onGesture) this.onGesture(true);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!this.drag) return;
      const raw = this.drag.start + (e.clientY - this.drag.y) / (this.drag.scale * DB_STEP);
      const v = e.shiftKey ? Math.round(clamp(raw, 0, 8) * 100) / 100 : Math.round(clamp(raw, 0, 8));
      this.set(v, true);
    });
    const end = () => {
      if (!this.drag) return;
      this.drag = null;
      this.el.classList.remove('active');
      if (this.onGesture) this.onGesture(false);
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('dblclick', () => this.set(this.def.def, true));
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.nudge(e.deltaY > 0 ? 1 : -1, e.shiftKey);   // scroll down = pull out
    }, { passive: false });
    svg.addEventListener('keydown', (e) => {
      const dir = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.nudge(dir, e.shiftKey); }
      else if (/^[0-8]$/.test(e.key)) { e.preventDefault(); e.stopPropagation(); this.set(Number(e.key), true); }
    });
  }
}

// 9 drawbars with a title and an editable registration string.
class DrawbarSet {
  // ids: 9 param ids; onSet(id, v) applies one bar; gesture(id, begin)
  constructor(title, ids, values, onSet, gesture, opts) {
    opts = opts || {};
    this.ids = ids;
    this.onSet = onSet;
    const el = document.createElement('div');
    el.className = 'db-set' + (opts.small ? ' small' : '');
    el.innerHTML = `
      <div class="db-set-head">
        <span class="db-set-title">${title}</span>
        <input class="reg-input" type="text" spellcheck="false" autocomplete="off" maxlength="13"
               title="Registration: type nine digits 0-8, e.g. 888000000, then Enter">
      </div>
      <div class="db-row"></div>`;
    this.el = el;
    this.input = el.querySelector('.reg-input');
    const row = el.querySelector('.db-row');
    this.bars = ids.map((id, i) => {
      const foot = opts.feet ? opts.feet[i] : i;
      const b = new Drawbar(PARAM_BY_ID[id], values[id], FOOTAGE_TIPS[foot], FOOTAGE_SHORT[foot],
        (v) => { onSet(id, v); this.renderString(); }, (begin) => gesture(id, begin));
      b.el.dataset.param = id;
      row.appendChild(b.el);
      return b;
    });
    if (opts.noString) this.input.style.display = 'none';
    const commit = () => {
      const regs = parseRegistration(this.input.value);
      if (!regs) { this.input.classList.add('bad'); return; }
      this.input.classList.remove('bad');
      regs.slice(0, ids.length).forEach((v, i) => {
        if (v !== this.bars[i].value) { this.bars[i].animateTo(v); this.bars[i].value = v; onSet(ids[i], v); }
      });
      this.renderString();
      this.input.blur();
    };
    this.input.addEventListener('keydown', (e) => {
      e.stopPropagation();   // typing digits must not play notes
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { e.preventDefault(); this.renderString(); this.input.blur(); }
    });
    this.input.addEventListener('keyup', (e) => e.stopPropagation());
    this.input.addEventListener('change', commit);
    this.input.addEventListener('focus', () => this.input.select());
    this.renderString();
  }

  setActive(on) { this.el.classList.toggle('active', !!on); }

  renderString() {
    if (document.activeElement === this.input) return;
    const vals = this.bars.map(b => b.value);
    this.input.value = this.ids.length === 9 ? registrationString(vals) : vals.map(v => Math.round(v)).join(' ');
    this.input.classList.remove('bad');
  }
}

  <script>
// ============================================================================
//  CabinetView: the animated cutaway of the four cabinets.
//   - the rotor angles come from the engine (`rotor` events, 30 Hz, angle in turns,
//     0 = facing the front); every frame draws the angle extrapolated from the latest
//     report with its speed (no lag at a steady speed). When a new report disagrees with
//     the extrapolation, the difference becomes an offset that fades out over ~80 ms,
//     so the drawing never jumps
//   - a horn is drawn on an elliptical orbit (a front view of a vertical axis): its
//     mouth faces you at angle 0; the drum shows its slats and scoop opening sliding by
//   - at speed, ghost copies of the horn trail it (motion blur)
//   - switching cabinets cross-fades the drawings; the layout options show: horn only /
//     drum only / stationary, dual active horns, open back, mic stands per mic layout
//   - it costs nothing when nothing moves: the loop stops when the window is hidden, the
//     page isn't shown, or the rotors stand still and the drawing has caught up
// ============================================================================
'use strict';

const CAB_W = 280, CAB_H = 330;
const SVGNS = 'http://www.w3.org/2000/svg';

// Geometry per cabinet model (front view, viewBox 280 x 330).
const CAB_GEOMS = [
  { name: 'ROTOR 22', body: [50, 10, 180, 312], hornWin: [60, 46, 160, 98], hornC: [140, 98, 62, 13], amp: 160,
    drumWin: [60, 190, 160, 122], drumC: [140, 252, 62, 70], horn: true, drum: true },
  { name: 'ROTOR 45', body: [44, 70, 192, 252], hornWin: [54, 100, 172, 80], hornC: [140, 142, 66, 12], amp: 192,
    drumWin: [54, 214, 172, 98], drumC: [140, 264, 66, 58], horn: true, drum: true },
  { name: 'SINGLE ROTOR', body: [55, 110, 170, 212], hornWin: null, hornC: null, amp: 136,
    drumWin: [65, 160, 150, 150], drumC: [140, 236, 66, 100], horn: false, drum: true, foam: true },
  { name: 'TONE CABINET', body: [60, 10, 160, 312], hornWin: null, hornC: null, amp: 272,
    drumWin: null, drumC: null, horn: false, drum: false, tone: true },
];

function svgEl(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

class CabinetView {
  constructor(container) {
    this.model = 0;
    this.prevModel = -1;
    this.opts = { rotorConfig: 0, hornType: 0, cabBack: 0, micLayout: 1, micAngle: 90, micDist: 0.4, hornDir: 0, drumDir: 1, drumBaffle: 0 };
    this.rotor = { hornAngle: 0, drumAngle: 0, hornHz: 0, drumHz: 0, t: performance.now() };
    this.shown = { horn: 0, drum: 0 };     // drawn angles (turns)
    this.offset = { horn: 0, drum: 0 };    // correction fading out after each report
    this.lastFrame = 0;
    this.running = false;
    this.visible = true;                   // set by the page
    this.frames = 0;                       // for the tests / CPU measurement
    this.busyMs = 0;

    const svg = svgEl('svg', { class: 'cab-svg', viewBox: `18 0 ${CAB_W - 36} ${CAB_H}`, role: 'img', 'aria-label': 'Rotary cabinet' });
    svg.innerHTML = `
      <defs>
        <linearGradient id="cabWood" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#3b200f"/><stop offset="45%" stop-color="#5a3219"/><stop offset="100%" stop-color="#2e180b"/>
        </linearGradient>
        <linearGradient id="cabInside" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0d0705"/><stop offset="100%" stop-color="#1a0f0a"/>
        </linearGradient>
        <linearGradient id="cabOpen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a2c22"/><stop offset="100%" stop-color="#241812"/>
        </linearGradient>
        <linearGradient id="hornMetal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f3efe6"/><stop offset="50%" stop-color="#b9b3a6"/><stop offset="100%" stop-color="#6f6a61"/>
        </linearGradient>
        <linearGradient id="drumFace" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#241710"/><stop offset="50%" stop-color="#6b4a33"/><stop offset="100%" stop-color="#241710"/>
        </linearGradient>
        <pattern id="foamDots" width="5" height="5" patternUnits="userSpaceOnUse">
          <rect width="5" height="5" fill="#4a3a2c"/><circle cx="2" cy="2" r="1" fill="#5d4a39"/>
        </pattern>
      </defs>`;
    this.svg = svg;
    this.layers = CAB_GEOMS.map((g, i) => this.buildLayer(g, i));
    this.mics = svgEl('g', { class: 'cab-mics' }, svg);
    this.label = svgEl('text', { class: 'cab-label', x: CAB_W / 2, y: CAB_H - 2 }, svg);
    container.appendChild(svg);

    document.addEventListener('visibilitychange', () => this.kick());
    this.setModel(0, true);
    this.applyOptions();
  }

  // ---------------------------------------------------------------- build ----
  buildLayer(g, index) {
    const L = svgEl('g', { class: 'cab-layer', 'data-model': index }, this.svg);
    const [bx, by, bw, bh] = g.body;
    svgEl('rect', { class: 'cab-body', x: bx, y: by, width: bw, height: bh, rx: 6 }, L);
    // louvres on top
    for (let i = 0; i < 4; i++) svgEl('line', { class: 'cab-louvre', x1: bx + 14, x2: bx + bw - 14, y1: by + 8 + i * 6, y2: by + 8 + i * 6 }, L);
    const layer = { g: L, geom: g, horns: [], ghosts: [], slats: [] };
    const win = (r) => svgEl('rect', { class: 'cab-win', x: r[0], y: r[1], width: r[2], height: r[3], rx: 3 }, L);
    if (g.hornWin) layer.hornWin = win(g.hornWin);
    if (g.drumWin) layer.drumWin = win(g.drumWin);

    // amp chassis with glowing tubes
    const amp = svgEl('g', { class: 'cab-amp' }, L);
    svgEl('rect', { x: bx + 20, y: g.amp, width: bw - 40, height: 18, rx: 2, class: 'cab-amp-box' }, amp);
    layer.tubes = [0, 1, 2, 3].map(i => svgEl('circle', { class: 'cab-tube', cx: bx + 40 + i * ((bw - 80) / 3), cy: g.amp + 9, r: 4 }, amp));

    if (g.horn) {
      const [cx, cy] = g.hornC;
      layer.hornGroup = svgEl('g', { class: 'horn-assy' }, L);
      for (let i = 0; i < 3; i++) layer.ghosts.push(svgEl('path', { class: 'horn-ghost' }, layer.hornGroup));
      for (let i = 0; i < 2; i++) {
        const body = svgEl('path', { class: 'horn-body' }, layer.hornGroup);
        const mouth = svgEl('ellipse', { class: 'horn-mouth' }, layer.hornGroup);
        layer.horns.push({ body, mouth });
      }
      svgEl('circle', { class: 'horn-hub', cx, cy, r: 6 }, layer.hornGroup);
      svgEl('rect', { class: 'horn-driver', x: cx - 9, y: cy + 8, width: 18, height: 22, rx: 2 }, layer.hornGroup);
    }
    if (g.drum) {
      const [cx, cy, rx, h] = g.drumC;
      layer.drumGroup = svgEl('g', { class: 'drum-assy' }, L);
      layer.drumFace = svgEl('rect', { class: g.foam ? 'drum-face foam' : 'drum-face', x: cx - rx, y: cy - h / 2, width: 2 * rx, height: h }, layer.drumGroup);
      for (let i = 0; i < 12; i++) layer.slats.push(svgEl('line', { class: 'drum-slat', y1: cy - h / 2 + 3, y2: cy + h / 2 - 3 }, layer.drumGroup));
      layer.scoop = svgEl('rect', { class: 'drum-scoop', y: cy - h / 2 + 6, height: h - 12, rx: 3 }, layer.drumGroup);
      svgEl('ellipse', { class: 'drum-rim', cx, cy: cy - h / 2, rx, ry: 7 }, layer.drumGroup);
      svgEl('ellipse', { class: 'drum-rim bottom', cx, cy: cy + h / 2, rx, ry: 7 }, layer.drumGroup);
    }
    if (g.tone) {
      // fixed speakers behind a grille, a reverb tank below
      svgEl('rect', { class: 'tone-grille', x: bx + 14, y: by + 40, width: bw - 28, height: 200, rx: 4 }, L);
      [[140, 90, 30], [140, 175, 30], [100, 225, 14], [180, 225, 14]].forEach(([x, y, r]) => {
        svgEl('circle', { class: 'tone-cone', cx: x, cy: y, r }, L);
        svgEl('circle', { class: 'tone-dust', cx: x, cy: y, r: r * 0.3 }, L);
      });
      svgEl('rect', { class: 'tone-tank', x: bx + 22, y: 250, width: bw - 44, height: 16, rx: 2 }, L);
      let d = '';
      for (let i = 0; i <= 24; i++) d += `${i ? 'L' : 'M'}${bx + 28 + i * ((bw - 56) / 24)} ${i % 2 ? 254 : 262}`;
      svgEl('path', { class: 'tone-spring', d }, L);
    }
    return layer;
  }

  // ---------------------------------------------------------- inputs ----
  setModel(i, now) {
    i = clamp(Math.round(i), 0, 3);
    if (i === this.model && !now) return;
    this.prevModel = now ? -1 : this.model;
    this.model = i;
    this.layers.forEach((l, k) => l.g.classList.toggle('active', k === i));
    this.fadeUntil = performance.now() + 400;
    this.applyOptions();
    this.kick();
  }

  setOptions(o) { Object.assign(this.opts, o); this.applyOptions(); this.kick(); }

  // a rotor report from the engine
  setRotor(r) {
    const now = performance.now();
    const before = this.predict (now);
    this.rotor = { hornAngle: r.hornAngle, drumAngle: r.drumAngle, hornHz: r.hornHz, drumHz: r.drumHz, t: now };
    const after = this.predict (now);
    for (const k of ['horn', 'drum']) {
      let d = before[k] + this.offset[k] - after[k];
      d -= Math.round(d);                      // shortest way round
      this.offset[k] = d;
    }
    this.kick();
  }

  // the angle (turns) the last report implies at time t
  predict(t) {
    const r = this.rotor, o = this.opts;
    const dt = Math.min(Math.max(0, (t - r.t) / 1000), 0.25);
    return { horn: r.hornAngle + (o.hornDir === 0 ? 1 : -1) * r.hornHz * dt,
             drum: r.drumAngle + (o.drumDir === 0 ? 1 : -1) * r.drumHz * dt };
  }

  setVisible(v) { this.visible = v; this.kick(); }

  applyOptions() {
    const o = this.opts;
    this.layers.forEach((l) => {
      const g = l.geom;
      const showHorn = g.horn && o.rotorConfig !== 2, showDrum = g.drum && o.rotorConfig !== 1;
      if (l.hornGroup) l.hornGroup.style.display = showHorn ? '' : 'none';
      if (l.drumGroup) l.drumGroup.style.display = showDrum ? '' : 'none';
      [l.hornWin, l.drumWin].forEach(w => w && w.classList.toggle('open', o.cabBack === 1));
      if (l.drumFace) l.drumFace.classList.toggle('open-baffle', o.drumBaffle === 1);
    });
    this.label.textContent = `${CAB_GEOMS[this.model].name}${o.cabBack === 1 ? ' · OPEN BACK' : ''}${o.rotorConfig === 3 && this.model < 3 ? ' · STATIONARY' : ''}`;
    this.drawMics();
    this.drawRotors(true);
  }

  // mic stands around the cabinet: left / right by the mic angle, further out with distance
  drawMics() {
    const o = this.opts, g = CAB_GEOMS[this.model];
    this.mics.innerHTML = '';
    const hornY = g.hornC ? g.hornC[1] : (g.drumC ? g.drumC[1] - 30 : 90);
    const drumY = g.drumC ? g.drumC[1] : 200;
    const half = (o.micAngle / 2) * Math.PI / 180;
    const side = (d) => 40 + 68 * Math.sin(half) + 24 * o.micDist + d;
    const mic = (x, y, label, far) => {
      const m = svgEl('g', { class: 'mic' + (far ? ' far' : '') }, this.mics);
      svgEl('line', { class: 'mic-stand', x1: x, y1: y + 6, x2: x, y2: CAB_H - 12 }, m);
      svgEl('rect', { class: 'mic-head', x: x - 3.5, y: y - 6, width: 7, height: 13, rx: 3.5 }, m);
      if (label) svgEl('text', { class: 'mic-label', x, y: y - 9 }, m).textContent = label;
    };
    const cx = CAB_W / 2;
    switch (o.micLayout) {
      case 0: mic(cx + 30, hornY, 'M'); if (g.drum) mic(cx + 30, drumY, ''); break;
      case 2: mic(cx - side(0), hornY, 'L'); mic(cx + side(0), hornY, 'R'); if (g.drum) { mic(cx - side(0), drumY, 'L'); mic(cx + side(0), drumY, 'R'); } break;
      case 3: mic(cx - side(0), hornY, 'L'); mic(cx + side(0), hornY, 'R'); if (g.drum) mic(cx + 34, drumY + 10, 'D'); break;
      case 4: mic(cx - 112, hornY - 30, 'F', true); mic(cx + 112, hornY - 30, 'B', true); break;
      default: mic(cx - side(0), hornY, 'L'); mic(cx + side(0), hornY, 'R'); if (g.drum) mic(cx + 30, drumY, 'D'); break;
    }
  }

  // ---------------------------------------------------------- animation ----
  kick() {
    if (this.running || document.hidden || !this.visible) return;
    this.running = true;
    this.lastFrame = 0;
    requestAnimationFrame((t) => this.frame(t));
  }

  frame(t) {
    if (document.hidden || !this.visible) { this.running = false; return; }
    const t0 = performance.now();
    const moving = this.advance(t);
    this.drawRotors(false);
    this.frames++;
    this.busyMs += performance.now() - t0;
    if (moving || t < this.fadeUntil) requestAnimationFrame((tt) => this.frame(tt));
    else this.running = false;
  }

  // extrapolated angle + the fading correction
  advance(t) {
    const r = this.rotor;
    const p = this.predict(t);
    const fade = Math.exp(-Math.max(0, t - (this.lastFrame || t)) / 80);
    this.lastFrame = t;
    let moving = r.hornHz > 0 || r.drumHz > 0;
    for (const k of ['horn', 'drum']) {
      this.offset[k] *= fade;
      if (Math.abs(this.offset[k]) < 1e-4) this.offset[k] = 0; else moving = true;
      const a = p[k] + this.offset[k];
      this.shown[k] = a - Math.floor(a);
    }
    this.frameTime = t;
    return moving;
  }

  hornPath(cx, cy, rx, ry, a) {
    // a in radians; 0 = mouth toward the viewer. Projected tip, mouth height by facing
    const sx = Math.sin(a), z = Math.cos(a);
    const tx = cx + rx * sx, ty = cy + ry * z * 0.6;
    const hw = 3, mh = 9 + 2 * Math.max(0, z);
    return { d: `M${cx.toFixed(1)} ${(cy - hw).toFixed(1)} L${tx.toFixed(1)} ${(ty - mh).toFixed(1)} L${tx.toFixed(1)} ${(ty + mh).toFixed(1)} L${cx.toFixed(1)} ${(cy + hw).toFixed(1)} Z`,
             tx, ty, z, mh };
  }

  drawRotors(force) {
    const o = this.opts;
    const stationary = o.rotorConfig === 3;
    const hornA = (stationary ? 0 : this.shown.horn) * 2 * Math.PI, drumA = (stationary ? 0 : this.shown.drum) * 2 * Math.PI;
    const active = [this.model];
    if (this.prevModel >= 0 && performance.now() < this.fadeUntil) active.push(this.prevModel);
    const hz = this.rotor.hornHz;
    for (const m of active) {
      const l = this.layers[m], g = l.geom;
      if (g.horn && l.hornGroup.style.display !== 'none') {
        const [cx, cy, rx, ry] = g.hornC;
        // back horn first: draw order by facing
        const pair = [0, 1].map(i => ({ i, p: this.hornPath(cx, cy, rx, ry, hornA + i * Math.PI) }));
        pair.sort((a, b) => a.p.z - b.p.z);
        pair.forEach(({ i, p }, order) => {
          const h = l.horns[order];
          h.body.setAttribute('d', p.d);
          const dummy = i === 1 && o.hornType === 0;
          h.body.classList.toggle('dummy', dummy);
          h.mouth.classList.toggle('dummy', dummy);
          h.mouth.setAttribute('cx', p.tx.toFixed(1));
          h.mouth.setAttribute('cy', p.ty.toFixed(1));
          h.mouth.setAttribute('rx', (1.5 + 8 * Math.max(0, p.z)).toFixed(1));
          h.mouth.setAttribute('ry', p.mh.toFixed(1));
          h.mouth.style.opacity = p.z > -0.1 ? '1' : '0';
        });
        l.hornGroup.dataset.angle = (hornA / (2 * Math.PI)).toFixed(4);   // drawn angle (turns), for the tests
        // motion blur: ghosts trailing the active horn at speed
        const blur = stationary ? 0 : clamp((hz - 1.5) / 5, 0, 1);
        l.ghosts.forEach((gh, k) => {
          if (blur <= 0) { gh.style.display = 'none'; return; }
          gh.style.display = '';
          const back = (o.hornDir === 0 ? 1 : -1) * hz * 2 * Math.PI * 0.012 * (k + 1);
          gh.setAttribute('d', this.hornPath(cx, cy, rx, ry, hornA - back).d);
          gh.style.opacity = (blur * (0.32 - k * 0.09)).toFixed(3);
        });
      }
      if (g.drum && l.drumGroup.style.display !== 'none') {
        const [cx, , rx] = g.drumC;
        l.slats.forEach((s, k) => {
          const a = drumA + k * Math.PI / 6;
          const z = Math.cos(a), x = cx + rx * Math.sin(a);
          s.setAttribute('x1', x.toFixed(1)); s.setAttribute('x2', x.toFixed(1));
          s.style.opacity = z > 0 ? (0.25 + 0.6 * z).toFixed(2) : '0';
        });
        const z = Math.cos(drumA), x = cx + rx * Math.sin(drumA);
        const w = 6 + 44 * Math.max(0, z);
        l.scoop.setAttribute('x', (x - w / 2).toFixed(1));
        l.scoop.setAttribute('width', w.toFixed(1));
        l.scoop.style.opacity = (0.15 + 0.85 * Math.max(0, z)).toFixed(2);
        l.drumGroup.dataset.angle = (drumA / (2 * Math.PI)).toFixed(4);
      }
    }
  }

  setDrive(d) { this.layers.forEach(l => l.tubes.forEach(t => { t.style.opacity = (0.45 + 0.55 * d).toFixed(2); })); }
}
